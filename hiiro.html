<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ひいろ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1B1330;
    --bg-surface:#241A3D;
    --bg-surface-2:#2E2249;
    --ink:#F4ECE3;
    --ink-soft:#B7A8C9;
    --ink-faint:#8477A0;
    --accent-warm:#F0A8B4;
    --accent-warm-dim:#7A4F58;
    --accent-calm:#7ED6C1;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% -10%, #34255A 0%, var(--bg-deep) 55%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0) 200px);
  }

  /* header */
  .head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 20px 16px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    position:sticky;
    top:0;
    background:var(--bg-deep);
    z-index:5;
  }
  .mark{
    width:34px;height:34px;border-radius:50%;
    position:relative;
    background:radial-gradient(circle, var(--accent-warm) 0%, var(--accent-warm-dim) 70%);
    box-shadow:0 0 0 0 rgba(240,168,180,0.5);
    animation:breathe 4.2s ease-in-out infinite;
    flex-shrink:0;
  }
  .mark.thinking{animation-duration:1.6s;}
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(240,168,180,0.35); transform:scale(1); }
    50%{ box-shadow:0 0 0 10px rgba(240,168,180,0); transform:scale(1.08); }
  }
  .head-text .name{
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    letter-spacing:0.04em;
  }
  .head-text .status{
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:0.05em;
  }

  /* thread */
  .thread{
    flex:1;
    padding:20px 18px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow-y:auto;
  }
  .row{ display:flex; }
  .row.hiiro{ justify-content:flex-start; }
  .row.user{ justify-content:flex-end; }

  .bubble{
    max-width:82%;
    padding:13px 16px;
    line-height:1.75;
    font-size:15px;
    white-space:pre-line;
  }
  .row.hiiro .bubble{
    font-family:'Shippori Mincho', serif;
    background:var(--bg-surface);
    border-radius:4px 16px 16px 16px;
    color:var(--ink);
    letter-spacing:0.02em;
  }
  .row.user .bubble{
    background:var(--accent-warm-dim);
    border-radius:16px 4px 16px 16px;
    color:#FBEFE8;
    font-size:14px;
  }

  .thinking-dots{
    font-family:'Shippori Mincho', serif;
    color:var(--ink-faint);
    padding:13px 16px;
  }
  .thinking-dots span{ animation:blink 1.4s infinite; }
  .thinking-dots span:nth-child(2){ animation-delay:.2s; }
  .thinking-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  .grounding{
    border-left:2px solid var(--accent-calm);
    background:rgba(126,214,193,0.08);
  }
  .grounding .bubble{ background:transparent; }

  /* button grid: equal-width, evenly spaced */
  .btn-wrap{
    padding:2px 18px 22px;
  }
  .btn-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
    gap:9px;
  }
  .btn-grid.single{ grid-template-columns:1fr; }
  .opt{
    appearance:none;
    border:1px solid rgba(255,255,255,0.14);
    background:var(--bg-surface-2);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13.5px;
    padding:13px 10px;
    border-radius:12px;
    cursor:pointer;
    text-align:center;
    line-height:1.4;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .opt:hover{ border-color:var(--accent-warm); transform:translateY(-1px); }
  .opt:active{ transform:translateY(0px) scale(0.98); }
  .opt.primary{
    background:linear-gradient(135deg, var(--accent-warm), #D98A9B);
    color:#2A1420;
    border:none;
    font-weight:700;
  }
  .opt.calm{ border-color:var(--accent-calm); color:var(--accent-calm); background:transparent; }
  .opt.ghost{ background:transparent; color:var(--ink-faint); border-color:rgba(255,255,255,0.08); }

  .cta-final{
    display:block;
    text-decoration:none;
    text-align:center;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--accent-warm), #D98A9B);
    color:#2A1420;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:0.02em;
    box-shadow:0 6px 22px rgba(240,168,180,0.25);
  }
  .cta-sub{
    font-size:11.5px;
    color:var(--ink-faint);
    text-align:center;
    margin-top:8px;
  }

  .locked{
    text-align:center;
    color:var(--ink-faint);
    font-size:12px;
    padding:18px 0 26px;
    letter-spacing:0.04em;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:3px; }
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <div class="mark" id="mark"></div>
    <div class="head-text">
      <div class="name">ひいろ</div>
      <div class="status" id="statusText">そばにいます</div>
    </div>
  </div>

  <div class="thread" id="thread"></div>
  <div class="btn-wrap" id="btnWrap"></div>
</div>

<script>
/* =========================================================
   CONFIG — replace before deploying
   ========================================================= */
const CONFIG = {
  lpUrl: "https://example.com/your-lp-here",     // ← 美脳調律プログラム LPへのリンクに差し替え
  modeOptions: [
    { label: "恋愛のこと",     value: "恋愛" },
    { label: "仕事のこと",     value: "仕事" },
    { label: "自分自身のこと", value: "自分" },
    { label: "その他",         value: "その他" }
  ],
  thinkingDelayMs: 900
};

/* =========================================================
   STATE — all local. No backend / no diagnosis module.
   ========================================================= */
const state = {
  phase: "pre",
  mode: null,
  relational: null,     // 「誰かとの間 / ひとりの時」= lastEnergy相当
  bodyPart: null,
  loopCount: 0,
  bodyLoop: 0,
  distressHistory: [],  // 直近5件の重み付け履歴（overload判定用）
  overloadActive: false,
  locked: false,
  entryWord: null,
  sensationWord: null,
  lastEnergy: null       // catchで拾った「具体」語。現状entryWordで代用
};

const thread = document.getElementById("thread");
const btnWrap = document.getElementById("btnWrap");
const mark = document.getElementById("mark");
const statusText = document.getElementById("statusText");

/* ---------------------------------------------------------
   時間語・人物語・場所語の簡易抽出（将来、自由入力欄を
   追加した場合に備えたフック。現状のUIはボタン選択式のため
   未使用。自由入力を追加する際はここにワード辞書を足す）
   --------------------------------------------------------- */
function extractLastEnergy(text){
  if (!text) return null;
  const timeWords = ["毎日","いつも","最近","昔","今","急に","ずっと"];
  const placeWords = ["家","職場","学校","電話","会うと"];
  const personWords = ["彼","彼女","母","父","友達","上司","相手"];
  const dict = [...timeWords, ...placeWords, ...personWords];
  for (const w of dict){ if (text.includes(w)) return w; }
  return null;
}

function addHiiroBubble(text, opts={}){
  const row = document.createElement("div");
  row.className = "row hiiro" + (opts.grounding ? " grounding" : "");
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
}

function addUserBubble(text){
  const row = document.createElement("div");
  row.className = "row user";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
}

/* opts.delay で個別に間を指定できるようにした（既定はCONFIG.thinkingDelayMs） */
function say(text, opts={}, cb){
  mark.classList.add("thinking");
  statusText.textContent = "考えています…";
  const dots = document.createElement("div");
  dots.className = "thinking-dots";
  dots.innerHTML = "<span>・</span><span>・</span><span>・</span>";
  thread.appendChild(dots);
  thread.scrollTop = thread.scrollHeight;

  const delay = opts.delay || CONFIG.thinkingDelayMs;

  setTimeout(()=>{
    thread.removeChild(dots);
    mark.classList.remove("thinking");
    statusText.textContent = "そばにいます";
    addHiiroBubble(text, opts);
    if (cb) cb();
  }, delay);
}

function renderButtons(options, gridStyle){
  btnWrap.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "btn-grid" + (options.length <= 1 ? " single" : "");
  options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "opt" + (opt.style ? " "+opt.style : "");
    btn.textContent = opt.label;
    btn.onclick = ()=>{
      addUserBubble(opt.label);
      btnWrap.innerHTML = "";
      handleSelection(opt);
    };
    grid.appendChild(btn);
  });
  btnWrap.appendChild(grid);
}

function renderLocked(text){
  btnWrap.innerHTML = "";
  const div = document.createElement("div");
  div.className = "locked";
  div.textContent = text;
  btnWrap.appendChild(div);
  state.locked = true;
}

function renderCTA(){
  btnWrap.innerHTML = "";
  const a = document.createElement("a");
  a.className = "cta-final";
  a.href = CONFIG.lpUrl;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "美脳調律プログラムを見てみる";
  btnWrap.appendChild(a);
  const sub = document.createElement("div");
  sub.className = "cta-sub";
  sub.textContent = "気が向いたときに、いつでも。";
  btnWrap.appendChild(sub);
}

/* ---------------------------------------------------------
   overload判定：直近5件の選択に distress weight を蓄積し、
   2回以上たまったら全モジュール共通で最優先グラウンディング。
   --------------------------------------------------------- */
function pushDistress(weight){
  state.distressHistory.push(weight);
  if (state.distressHistory.length > 5) state.distressHistory.shift();
  const hits = state.distressHistory.filter(w => w === "distress").length;
  return hits >= 2;
}

function triggerOverload(){
  state.overloadActive = true;
  say("……少し、いっぱいいっぱいかもしれない。\n一度、足の裏が床についてる感じ、確かめてみて。\nゆっくり、息を吸って。吐いて。", {grounding:true}, ()=>{
    renderButtons([
      { label:"少し落ち着いた", style:"calm", action:"overload_ok" },
      { label:"まだしんどい",   style:"calm", action:"overload_more" }
    ]);
  });
}

/* =========================================================
   FLOW
   ========================================================= */
function start(){
  say("こんにちは、ひいろです。\nよかったら、少しお話ししませんか。", {}, ()=>{
    renderButtons([{ label:"うん", style:"primary", action:"begin_select" }]);
  });
}

function goSelect(){
  state.phase = "select";
  say("今日は、どのあたりのこと、話してみたい？", {}, ()=>{
    renderButtons(CONFIG.modeOptions.map(m => ({ label:m.label, value:m.value, action:"mode_selected" })));
  });
}

function goCatchEntry(){
  state.phase = "loop";
  say(`そっか。${state.mode}のこと、今どんな感じがありますか？`, {}, ()=>{
    renderButtons([
      { label:"わからない", action:"catch_reply" },
      { label:"なんか違う", action:"catch_reply" },
      { label:"もやもや",   action:"catch_reply" },
      { label:"疲れた",     action:"catch_reply", weight:"distress" },
      { label:"その他",     action:"catch_reply" }
    ]);
  });
}

/* ---------------------------------------------------------
   ④ 具体と抽象の往復（新規）
   entryWordという「具体」を、HIIROが一度「抽象」で受け取り、
   「近い」ならもう一度具体（entryWordそのもの）に降りて
   身体へ直結する。それ以外は従来のsensationループへ合流し、
   既存構造は壊さない。
   --------------------------------------------------------- */
function goCatchAbstract(){
  say("止まってる感じ、ずっとある感じですか", {}, ()=>{
    renderButtons([
      { label:"近い",       action:"abstract_reply" },
      { label:"まだ違う",   action:"abstract_reply" },
      { label:"わからない", action:"abstract_reply" }
    ]);
  });
}

function goCatchModule(){
  state.currentModule = "catch";
  say(`「${state.entryWord}」、か。\nうまく言えなくていい。近いのがあれば、それだけ教えて。`, {}, ()=>{
    renderButtons([
      { label:"重い感じ",       action:"catch_sensation" },
      { label:"ざわざわする感じ", action:"catch_sensation" },
      { label:"固まる感じ",     action:"catch_sensation" },
      { label:"うまく言えない", action:"catch_sensation" }
    ]);
  });
}

function goCatchProbe(){
  state.loopCount++;
  say(`「${state.sensationWord}」、今の感じに近い？`, {}, ()=>{
    renderButtons([
      { label:"近い",       action:"catch_probe_reply" },
      { label:"まだ違う",   action:"catch_probe_reply" },
      { label:"わからない", action:"catch_probe_reply" }
    ]);
  });
}

/* ① catch → hiiro の橋渡し（認識の回復）
   どの答えでも前進。「少し」のときだけ1800ms相当の間を置く。 */
function goCatchTorque(){
  say("少し、見えてきた感じしない？", {}, ()=>{
    renderButtons([
      { label:"少し",       action:"torque_reply" },
      { label:"まだ",       action:"torque_reply" },
      { label:"わからない", action:"torque_reply" }
    ]);
  });
}

function goHiiroModule(){
  const echo = (state.sensationWord && state.sensationWord !== "うまく言えない")
    ? `「${state.entryWord}」で、「${state.sensationWord}」な感じ、か。`
    : `「${state.entryWord}」、か。うまく言えない、それでいい。`;
  say(`${echo}\nそれ、体のどこかにある？`, {}, ()=>{
    renderButtons([
      { label:"胸のあたり", action:"body_selected" },
      { label:"喉のあたり", action:"body_selected" },
      { label:"頭のあたり", action:"body_selected" },
      { label:"わからない", action:"body_selected" }
    ]);
  });
}

function goHiiroTorqueChoice(){
  say(`${state.bodyPart || "そのあたり"}、置いておく？　それとも、もう少し見る？`, {}, ()=>{
    renderButtons([
      { label:"置いておく",   action:"torque_bridge" },
      { label:"もう少し見る", action:"torque_bridge" }
    ]);
  });
}

function goHiiroTorque(choiceLabel){
  state.bodyLoop++;
  const preface =
    choiceLabel === "もう少し見る" ? "それでいい。そのままで。"
    : "わからなくていい。";
  say(preface, {}, ()=>{
    goHiiroFlowFixed();
  });
}

/* ② 身体軸「置いておく」の直後（身体の回復）
   少し   →（1800ms相当）「そっか。」→ ③存在の回復へ
   あまり →「それでいい。そのままで。」→ ③存在の回復へ
   わからない →「わからなくていい。」→ ③存在の回復へ
   「あまり」はまだ変化が薄いサインとしてdistress weightを付与 */
function goHiiroFlowFixed(){
  say(`${state.bodyPart || "そのあたり"}、少し変わった感じある？`, {}, ()=>{
    renderButtons([
      { label:"少し",       action:"flow_reply" },
      { label:"あまり",     action:"flow_reply", weight:"distress" },
      { label:"わからない", action:"flow_reply" }
    ]);
  });
}

/* ③ offer 直前（存在の回復・新規） */
function goExistenceCheck(){
  say("今、ここにいる感じ、する？", {}, ()=>{
    renderButtons([
      { label:"少し",       action:"existence_reply" },
      { label:"わからない", action:"existence_reply" }
    ]);
  });
}

const SESSION_DESC = {
  "雰囲気は？": "静かで、急かされない場所。話す速さは、いつもあなたのペースに合わせます。",
  "どんな変化があるの？": "何かが劇的に変わるというより、\n自分の感覚に、少しずつ戻っていく感じ。",
  "体験者の声は？": "「ここでは、取り繕わなくていいんだと気づいた」\nそう話してくれた人が、何人もいました。"
};

function goShowCTA(){
  say("それなら、少しだけ見てみて。", {}, ()=>{
    btnWrap.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "btn-grid";
    Object.keys(SESSION_DESC).forEach(label=>{
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = label;
      btn.onclick = ()=>{ addUserBubble(label); goSessionDesc(label); };
      grid.appendChild(btn);
    });
    btnWrap.appendChild(grid);

    const spacer = document.createElement("div");
    spacer.style.marginTop = "10px";
    btnWrap.appendChild(spacer);
    renderCTAInline();
  });
}

function renderCTAInline(){
  const a = document.createElement("a");
  a.className = "cta-final";
  a.href = CONFIG.lpUrl;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "美脳調律プログラムを見てみる";
  btnWrap.appendChild(a);
}

function goSessionDesc(label){
  say(SESSION_DESC[label], {}, ()=>{
    goShowCTAFinal();
  });
}

function goShowCTAFinal(){
  say("よかったら、ここから覗いてみて。", {}, ()=>{
    renderCTA();
  });
}

/* =========================================================
   ROUTER
   ========================================================= */
function handleSelection(opt){
  if (opt.weight) {
    const overload = pushDistress(opt.weight);
    if (overload && !state.overloadActive) {
      triggerOverload();
      return;
    }
  }

  switch(opt.action){
    case "begin_select":
      goSelect(); break;

    case "mode_selected":
      state.mode = opt.value;
      goCatchEntry(); break;

    case "catch_reply":
      state.entryWord = opt.label;
      state.lastEnergy = opt.label; // 将来: extractLastEnergy(freeText) に差し替え可能
      goCatchAbstract(); break;

    /* ④ 近いなら身体へショートカット。それ以外は従来のsensationループへ合流 */
    case "abstract_reply":
      if (opt.label === "近い") {
        say(`…${state.lastEnergy}、か。`, {delay:1000}, ()=>{
          say("そのとき、体のどこかにある？", {}, ()=>{
            renderButtons([
              { label:"胸のあたり", action:"body_selected" },
              { label:"喉のあたり", action:"body_selected" },
              { label:"頭のあたり", action:"body_selected" },
              { label:"わからない", action:"body_selected" }
            ]);
          });
        });
      } else {
        goCatchModule();
      }
      break;

    case "catch_sensation":
      state.sensationWord = opt.label;
      goCatchProbe(); break;

    case "catch_probe_reply":
      if (opt.label === "近い" && state.loopCount >= 3){
        goCatchTorque();
      } else if (opt.label === "近い"){
        goHiiroModule();
      } else {
        goCatchModule();
      }
      break;

    case "torque_reply":
      if (opt.label === "少し") {
        setTimeout(()=>{ goHiiroModule(); }, 900); // sayの900msに追加して合計約1800ms
      } else {
        goHiiroModule();
      }
      break;

    case "body_selected":
      state.bodyPart = opt.label;
      goHiiroTorqueChoice(); break;

    case "torque_bridge":
      goHiiroTorque(opt.label); break;

    case "flow_reply": {
      let msg, delay;
      if (opt.label === "少し") { msg = "そっか。"; delay = 1800; }
      else if (opt.label === "あまり") { msg = "それでいい。そのままで。"; delay = 900; }
      else { msg = "わからなくていい。"; delay = 900; }
      say(msg, {delay}, ()=>{ goExistenceCheck(); });
      break;
    }

    case "existence_reply":
      say("もう少し戻れるかもしれない。\n一緒に、見てみませんか。", {delay:1800}, ()=>{
        renderButtons([
          { label:"はい",       style:"primary", action:"offer_reply" },
          { label:"やめておく", style:"ghost",   action:"offer_reply" }
        ]);
      });
      break;

    case "offer_reply":
      if (opt.label === "はい") goShowCTA();
      else renderLocked("また、気が向いたら。");
      break;

    case "overload_ok":
      state.overloadActive = false;
      goExistenceCheck();
      break;

    case "overload_more":
      say("大丈夫。ここにいるから、急がなくていい。\nもう少し、呼吸だけ感じてみて。", {grounding:true}, ()=>{
        renderButtons([
          { label:"少し落ち着いた", style:"calm", action:"overload_ok" },
          { label:"まだしんどい",   style:"calm", action:"overload_more" }
        ]);
      });
      break;
  }
}

start();
</script>
</body>
</html>
